# AI4S 投资 sourcing —— 配置
# 范围：AI × 全部科学领域（全球），按「科学领域」分批从 OpenAlex 抓取，见下方 fetch 段

track_name: "AI人才地图"

# 登录：多人共用时保持开启；只在自己电脑上单人用可以改成 false
# 账号用 python3 manage_users.py 管理（第一次先建管理员），数据存在 team.db
auth:
  enabled: true

openalex:
  # API Key 不要写在这里（这个文件会分享给组员、上传到服务器）。按以下顺序读取：
  #   1) 环境变量 OPENALEX_API_KEY   2) 项目文件夹里的 .openalex_key 文件（只有一行 Key，不要分享）
  # 免费申请：https://openalex.org/settings/api；有 Key 每天免费 $1 额度
  api_key: ""
  # 可选：联系邮箱
  mailto: ""
  from_date: "2019-01-01"
  # 论文类型：期刊论文、预印本、会议论文（NeurIPS/ICML/ICLR 等 AI 会议的主要产出）、综述
  types: ["article", "preprint", "conference-paper", "review"]
  per_page: 100            # OpenAlex 现行上限是 100
  # 每条检索式最多抓取的论文数（MVP 先控制规模）
  max_per_query: 6000
  # 【旧版单赛道检索式，已不再使用，保留备查】全领域检索式见下方 fetch.domains
  legacy_queries:
    - '("protein design" OR "de novo protein" OR "protein engineering") AND ("deep learning" OR "neural network" OR "diffusion" OR "generative" OR "language model" OR "machine learning")'
    - '("antibody" OR "nanobody" OR "TCR" OR "binder design") AND ("deep learning" OR "neural network" OR "diffusion" OR "generative" OR "language model" OR "machine learning")'
    - '("protein structure prediction" OR "AlphaFold" OR "RoseTTAFold" OR "ESMFold" OR "protein language model")'
    - '("enzyme design" OR "enzyme engineering" OR "directed evolution") AND ("deep learning" OR "machine learning" OR "generative")'
    - '("peptide design" OR "biologics" OR "protein-protein interaction" OR "binding affinity") AND ("deep learning" OR "geometric deep learning" OR "graph neural network" OR "diffusion model")'

# 规则分类器：论文必须同时命中 AI 方法词 和 生物药/蛋白领域词
classifier:
  ai_terms:
    - deep learning
    - neural network
    - machine learning
    - diffusion model
    - denoising diffusion
    - generative model
    - generative ai
    - deep generative
    - language model
    - transformer
    - graph neural
    - geometric deep learning
    - equivariant
    - foundation model
    - alphafold
    - rosettafold
    - esmfold
    - proteinmpnn
    - rfdiffusion
    - reinforcement learning
    - variational autoencoder
    - flow matching
    - large language model
    - artificial intelligence
    - physics-informed
    - neural operator
    # 通用 AI 方向的 AI 词
    - llm
    - llms
    - world model
    - agent
    - agents
    - multi-agent
    - pretrain
    - post-training
    - rlhf
    - mixture of experts
    - vision-language
    - multimodal
    - code generation
    - benchmark
    - diffusion
    - robot
    - jailbreak
    - generative
    - neural radiance
    - gaussian splatting
    - autonomous driving
    - automl
    - neural architecture search
    - chatgpt
    - gpt-4
  # 【旧版】蛋白赛道领域词，已不再用于判定；现在论文需命中 AI 方法词 + taxonomy 里任一科学领域
  domain_terms:
    - protein
    - antibod
    - nanobod
    - enzyme
    - peptide
    - binder
    - biologic
    - tcr
    - epitope
    - antigen
    - amino acid
  # 子方向（用于画像，命中任一关键词即打标签）
  subtopics:
    结构预测: ["structure prediction", "alphafold", "rosettafold", "esmfold", "folding"]
    从头设计: ["de novo", "protein design", "rfdiffusion", "proteinmpnn", "inverse folding", "backbone generation"]
    抗体与免疫: ["antibod", "nanobod", "tcr", "epitope", "antigen", "immunogen", "cdr"]
    酶工程: ["enzyme", "directed evolution", "catalytic"]
    蛋白语言模型: ["protein language model", "esm-2", "esm2", "protein lm", "plm"]
    多肽与小蛋白: ["peptide", "miniprotein", "cyclic"]
    相互作用与亲和力: ["protein-protein interaction", "binding affinity", "docking", "binder"]
    适应性与突变预测: ["fitness", "mutation effect", "variant effect", "stability prediction", "thermostab"]

# =====================================================================
# 全领域抓取：每个二级科学领域单独检索、单独缓存（data/works/领域名.jsonl）
#   - 检索式 = (领域词) AND (ai_clause)，在标题+摘要里匹配
#   - 每个领域取三批：「2019 年以来被引最高的 top_cited 篇」+「近 recent_years 年被引最高的 recent 篇」
#     +「近 newest_months 个月最新发表的 newest 篇」（按发表时间排，不看被引）
#     后者保证新冒头的青年人才不会被老论文挤掉
#   - 额度：中等规模全跑一次约 $0.7–0.9（OpenAlex 有 Key 每天免费 $1），用完会自动停下，
#     第二天再运行同一条命令即从断点续跑；已抓完的领域不会重复抓
#   - 想加新领域：先在下方 taxonomy.science_domains 里加二级学科和关键词，再在这里加检索式
# =====================================================================
fetch:
  from_date: "2019-01-01"
  top_cited: 2000
  recent: 1000
  recent_years: 2
  # 第三批「最新论文」：让刚发表、还没被引用的新人新作也能进来；设为 0 关闭
  newest: 1000
  newest_months: 6
  # 每次更新时保留上次抓到、仍在窗口内的最新论文，逐周累积；每个领域最多保留这么多篇
  # （内存考虑：全领域 4.5 万篇未精简时约占 2.7GB；精简后每篇约 1/4，5000 篇/领域在 4G 服务器上较稳妥）
  newest_keep: 5000
  ai_clause: '("deep learning" OR "machine learning" OR "neural network" OR "artificial intelligence" OR "generative model" OR "diffusion model" OR "language model" OR "foundation model" OR "graph neural network" OR "reinforcement learning")'
  domains:
    蛋白与核酸设计: '("protein design" OR "protein engineering" OR "de novo protein" OR antibody OR nanobody OR "enzyme engineering" OR "peptide design" OR "RNA design" OR aptamer OR "protein structure prediction")'
    药物发现: '("drug discovery" OR "drug design" OR "virtual screening" OR "molecular docking" OR "drug-target interaction" OR ADMET OR "lead optimization")'
    细胞与多组学: '("single-cell" OR "single cell" OR transcriptomics OR "spatial transcriptomics" OR "multi-omics" OR proteomics OR "gene expression" OR "virtual cell")'
    医学AI与临床: '("clinical" OR "medical imaging" OR "electronic health records" OR radiology OR pathology OR diagnosis)'
    分子与反应: '(retrosynthesis OR "reaction prediction" OR "molecular generation" OR "molecular property prediction" OR "chemical synthesis" OR "chemical reaction")'
    计算材料: '("materials discovery" OR "crystal structure prediction" OR "interatomic potential" OR "density functional theory" OR "materials design" OR "inorganic materials")'
    材料实验与器件: '(perovskite OR "thin film" OR semiconductor OR polymer OR "materials synthesis" OR "device fabrication")'
    能源与催化: '(battery OR electrolyte OR electrocatalysis OR photocatalysis OR "solar cell" OR catalyst OR "CO2 reduction")'
    量子与凝聚态: '("quantum many-body" OR "condensed matter" OR superconductivity OR "quantum chemistry" OR "quantum circuit" OR "spin system" OR "phase transition")'
    等离子体与空间物理: '(plasma OR tokamak OR "nuclear fusion" OR magnetosphere OR "space weather" OR "solar wind")'
    光学与光子: '(photonics OR metasurface OR "optical design" OR nanophotonics OR laser)'
    气象气候: '("weather forecasting" OR "weather prediction" OR climate OR precipitation OR atmospheric OR ocean OR typhoon)'
    地球物理: '(seismic OR earthquake OR geophysics OR seismology OR "remote sensing")'
    天文与宇宙学: '(galaxy OR galaxies OR cosmology OR astronomy OR astrophysics OR "gravitational wave" OR exoplanet)'
    AI for Math: '("theorem proving" OR "formal proof" OR "mathematical reasoning" OR "mathematical discovery" OR conjecture OR "symbolic regression")'
    科学发现方法与科学计算: '("scientific discovery" OR "physical laws" OR "physical law" OR "symbolic formula" OR "symbolic formulas" OR "scientific machine learning" OR "physics-informed" OR "physics-inspired")'
    # ---- 通用 AI 方向（检索式本身就是 AI 词，不再拼接上面的 ai_clause，见 no_ai_clause）----
    大模型训练与自进化: '("large language model" OR "large language models" OR LLM OR LLMs) AND ("reinforcement learning" OR "post-training" OR RLHF OR "self-improvement" OR "self-improving" OR "self-evolving" OR "test-time scaling" OR "chain-of-thought" OR "scaling law")'
    模型架构与基础模型: '("foundation model" OR "foundation models" OR "mixture of experts" OR "mixture-of-experts" OR "state space model" OR "Kolmogorov-Arnold" OR "model architecture" OR "multimodal large language model" OR "vision-language model" OR "graph neural network")'
    世界模型与空间智能: '("world model" OR "world models" OR "spatial intelligence" OR "embodied agent" OR "embodied AI" OR "3D scene understanding" OR "video generation")'
    数据合成与评测: '("synthetic data" OR "data synthesis" OR "data curation" OR "data selection" OR "data recipe" OR benchmark OR "evaluation") AND ("large language model" OR "large language models" OR LLM OR LLMs OR "foundation model")'
    智能体与工具链: '("LLM agent" OR "LLM agents" OR "language agent" OR "AI agent" OR "multi-agent" OR "tool use" OR "tool learning" OR "agent memory" OR "long-term memory" OR "code generation" OR "GUI agent" OR "deep research")'
    AI系统与数据基础设施: '("machine learning system" OR "LLM serving" OR "LLM inference" OR "inference acceleration" OR "distributed training" OR "AI for database" OR "vector database" OR "database tuning")'
    推理与对齐: '("chain-of-thought" OR "test-time scaling" OR "reasoning model" OR "preference optimization" OR "reward model" OR "process reward" OR "mathematical reasoning" OR "in-context learning") AND ("large language model" OR "large language models" OR LLM OR LLMs)'
    可信与安全: '("large language model" OR "large language models" OR LLM OR LLMs OR "foundation model" OR "deep neural network" OR "deep neural networks") AND (jailbreak OR "red teaming" OR "AI safety" OR "adversarial attack" OR backdoor OR hallucination OR "machine unlearning" OR watermark OR interpretability OR "membership inference")'
    生成模型与多模态: '("diffusion model" OR "diffusion models" OR "text-to-image" OR "text-to-video" OR "image generation" OR "vision-language model" OR "multimodal large language model" OR "gaussian splatting" OR "neural radiance field")'
    具身智能: '("vision-language-action" OR "robot learning" OR "robotic manipulation" OR "imitation learning" OR "sim-to-real" OR "humanoid robot" OR "autonomous driving" OR "vision-language navigation")'
    代码与软件智能体: '("code generation" OR "large language models for code" OR "program synthesis" OR "SWE-bench" OR "automated program repair" OR "text-to-SQL" OR "software engineering agent")'
    AI for AI: '("neural architecture search" OR AutoML OR "automated machine learning" OR "AI scientist" OR "automated research" OR "research agent" OR "machine learning engineering agent")'
  # 这些领域的检索式不拼接 ai_clause；它们抓到的论文归入一级学科「通用AI」（除非论文明确属于某个科学领域）
  # 这些 AI4S 检索领域的论文属于「AI研究者」方向（检索式仍拼接 ai_clause）
  ai_side: [AI for Math, 科学发现方法与科学计算]
  no_ai_clause: [大模型训练与自进化, 模型架构与基础模型, 世界模型与空间智能, 数据合成与评测, 智能体与工具链, AI系统与数据基础设施, 推理与对齐, 可信与安全, 生成模型与多模态, 具身智能, 代码与软件智能体, AI for AI]

# =====================================================================
# Semantic Scholar 补充数据源（修正 OpenAlex 对 AI 学者、常见中文名的作者识别错误）
#   - 按同样的检索式补抓 OpenAlex 漏掉的论文（被引最高 top_cited 篇 + 最近 newest_months 个月最新 newest 篇）
#   - 用 DOI / arXiv 号把论文对到 S2，改用 S2 的完整作者列表（OpenAlex 超过 100 位作者会截断）
#   - 同一 DBLP 消歧标识（如 "Kai Chen 0026"）或同一 ORCID 的作者号合并为同一个人
#   API Key（免费，强烈建议）：申请 https://www.semanticscholar.org/product/api#api-key-form
#   拿到后在软件文件夹执行：echo 你的Key > .s2_key && chmod 600 .s2_key
# =====================================================================
s2:
  enabled: true
  top_cited: 2000
  newest: 1000
  newest_months: 6

talent:
  enrich_candidates: 3000   # 另外为近期主导论文影响力最高的这么多位补全履历（学术年龄、h 指数）
  recent_years: 2          # "近期"窗口
  min_track_papers: 2      # 进入人才库的最低赛道论文数
  top_n_enrich: 6000       # 对前 N 名作者调用作者接口补全职业信息（增量：已拉过的不重复拉）

# =====================================================================
# 人才地图分类体系：「科学领域 × AI方法」两个主维度 + 三个标签
# 关键词规则（不区分大小写；≤4 个字母的词要求整词匹配，长词允许后缀）
# 每篇论文可以命中多个类别；每位作者取出现最多的为「主」，第二多的为「副」
# =====================================================================
taxonomy:
  # 分类体系（对照「牵头科学家人才树」）：大类 → 领域 → 关键词（每个领域下只有一个同名的细分项，程序内部沿用两层结构）
  #   大类：AI研究者（按方向）/ 科学家（按学科），见下面 groups
  #   一篇论文按关键词打领域标签；作者取篇数最多的为主、第二多的为副
  labels: {group: 大类, top: 领域, domain: 领域, method: AI方法}
  science_domains:
    # ---------------- AI研究者 · 按方向
    RSI与自进化:
      RSI与自进化: [pretrain, pre-train, "scaling law", "mixture of experts", "mixture-of-experts", moe, "state space model", mamba, "linear attention", "long context", "long-context", "model architecture", "language model pretraining", "small language model", rlhf, "human feedback", "preference optimization", dpo, grpo, ppo, "reward model", "verifiable reward", rlvr, alignment, "post-training", "instruction tuning", "supervised fine-tuning", "self-improv", "self-evolv", "self-play", "self-rewarding", "self-refine", "self-correct", "self-reflect", "recursive self", "continual learning", "lifelong learning", "open-ended", "self-training", "reinforcement learning", rl, rlhf, reward, "binary feedback", "data-free training"]
    AI for AI:
      # 包括「用科学方法研究 AI 本身」（元模型、训练动力学、AI 的物理学），如刘子鸣
      AI for AI: [automl, "neural architecture search", "architecture search", "automated machine learning", "hyperparameter optimization", "machine learning engineering", "mle-bench", "research agent", "automated ai research", "ai research agent", "agent design", "automated design", "meta-learning", "learning to optimize", "kolmogorov-arnold", "meta model", "meta-model", "models that model", "physics of", "neural scaling", "training dynamics", "learning dynamics", "inductive bias", "weight matrices", "skill learning", "depth scaling", "time scaling", "thermodynamic laws", "science of deep learning", "training intuition"]
    智能体与推理:
      智能体与推理: ["llm agent", "language agent", "ai agent", "autonomous agent", agentic, "tool use", "tool learning", "tool-use", "function calling", "agent memory", "long-term memory", "web agent", "gui agent", "deep research", "computer use", "llm-based agent", "multi-agent", "multi agent", "multiple agents", "retrieval-augmented", "retrieval augmented", "chain-of-thought", "chain of thought", "test-time scaling", "test-time compute", "reasoning model", "large reasoning model", "math reasoning", "mathematical reasoning", "long reasoning", "slow thinking", "process reward", "tree of thoughts", "step-by-step", "reasoning ability", "reasoning capabilit", "in-context learning", prompting, "prompt engineering", "prompt optimization", "instruction following", "code generation", "code llm", "code language model", "large language models for code", "program synthesis", "software engineering", "swe-bench", "program repair", "code completion", "text-to-sql", "theorem proving", "theorem prover", "formal proof", "formal verification", "lean 4", lean4, mathlib, conjecture, "mathematical discovery"]
    可信与安全:
      可信与安全: [jailbreak, "red teaming", "red-teaming", "ai safety", "llm safety", "safety alignment", harmful, "prompt injection", guardrail, deceptive, misalignment, adversarial, backdoor, "membership inference", "differential privacy", privacy, watermark, "data poisoning", "federated learning", unlearning, hallucination, interpretab, mechanistic, "sparse autoencoder", factuality, explainab, "knowledge editing", "model editing", truthful]
    多模态·生成·世界模型:
      多模态·生成·世界模型: ["vision-language", "vision language model", "multimodal large language model", mllm, mllms, "multimodal llm", "large multimodal model", "visual question answering", "visual instruction", "image-text", "audio-language", "speech language model", "omni-modal", "video understanding", "diffusion model", "text-to-image", "text-to-video", "image generation", "video generation", "image editing", "image synthesis", "flow matching", "latent diffusion", "generative adversarial", "world model", "video prediction", "interactive environment", "gaussian splatting", nerf, "neural radiance", "3d generation", "3d reconstruction", "spatial intelligence", "spatial reasoning", "3d scene", "novel view synthesis", "causal world"]
    科学智能体与基础模型:
      科学智能体与基础模型: ["ai scientist", "scientific agent", "science agent", "hypothesis generation", "scientific discovery", "scientific foundation model", "foundation model for science", "scientific large language model", "scientific llm", "science llm", "physical law", "symbolic regression", "symbolic formula", "scientific machine learning", "physics-informed", "physics-inspired", "for science", "scientific reasoning"]
    具身智能:
      具身智能: ["vision-language-action", vla, "robot manipulation", "robotic manipulation", "robot learning", "imitation learning", "sim-to-real", dexterous, humanoid, embodied, legged, "robot policy", "diffusion policy", "autonomous driving", "self-driving", "end-to-end driving", "trajectory prediction", "vision-language navigation", "motion planning"]
    图学习·数据与系统:
      图学习·数据与系统: ["synthetic data", "data synthesis", "data curation", "data selection", "data mixture", "data recipe", "data quality", "data filtering", "pretraining data", "instruction data", "data contamination", benchmark, leaderboard, "llm-as-a-judge", "llm as a judge", "evaluation framework", "llm serving", "llm inference", "inference acceleration", "distributed training", "kv cache", quantiz, "speculative decoding", "model compression", pruning, "knowledge distillation", "parameter-efficient", lora, "low-rank adaptation", "gpu kernel", "machine learning system", "mixed-precision", "graph neural", gnn, gnns, "knowledge graph", "graph learning", "graph foundation", "vector database", "ai for database", "database tuning", "recommender system"]
    # ---------------- 科学家 · 按学科
    地球与气候:
      地球与气候: [weather, climate, precipitation, atmospher, ocean, typhoon, seismic, seismolog, earthquake, geophysic, "remote sensing", "land surface", hydrolog]
    空间与等离子体物理:
      空间与等离子体物理: [plasma, "nuclear fusion", tokamak, magnetosphere, "space weather", "solar wind", "laser-plasma", ionosphere]
    天文与宇宙学:
      天文与宇宙学: [galax, cosmolog, astronom, astrophysic, stellar, telescope, "dark matter", exoplanet, "gravitational wave"]
    量子与凝聚态:
      量子与凝聚态: [quantum, "condensed matter", superconduct, "many-body", "spin system", "phase transition"]
    光学与光子:
      光学与光子: [photonic, metasurface, "optical design", nanophotonic, laser]
    生命科学与医学:
      生命科学与医学: [protein, antibod, nanobod, enzyme, peptide, binder, "rna design", aptamer, "nucleic acid", "drug discovery", "drug design", "small molecule", "small-molecule", ligand, "virtual screening", admet, "drug-target", "lead optimization", "protein-ligand", "molecular generation", "molecule generation", "molecular design", "molecule design", "de novo molecular", "molecular property", "molecular conformation", conformer, "molecular graph", "3d molecule", "equivariant diffusion", "molecular representation", "molecular dynamics", "single-cell", "single cell", scrna, "virtual cell", perturbation, "spatial transcriptom", "cell atlas", "cell type", "gene regulatory", tumor, tumour, cancer, oncolog, immun, "t cell", "t-cell", tcr, neoantigen, "multi-omic", multiomic, proteomic, transcriptom, genomic, "gene expression", "spatial omics", clinical, patient, medical, "medical diagnos", "disease diagnos", "clinical diagnos", "cancer diagnos", "medical imag", ehr, hospital, "electronic health", radiolog, patholog, disease]
    化学与材料:
      化学与材料: ["thin film", perovskite, semiconductor, "device fabrication", polymer, batter, electrolyte, electrocataly, photocataly, "heterogeneous cataly", "solar cell", "hydrogen evolution", "co2 reduction", "self-driving lab", "autonomous lab", "materials synthesis", "materials discovery", "crystal structure", "density functional", dft, "interatomic potential", "materials design", "inorganic material", "crystal structure prediction", retrosynthe, "chemical reaction", "reaction prediction", "organic synthesis", "chemical synthesis", "chemical language model", "chemistry large language model", "large language models for chemistry", "llm for chemistry", "llms for chemistry", "materials foundation model", "chemistry foundation model", "chemical knowledge", "materials science large language model"]

  # 大类 → 领域
  groups:
    AI研究者: [RSI与自进化, AI for AI, 智能体与推理, 可信与安全, 多模态·生成·世界模型, 科学智能体与基础模型, 具身智能, 图学习·数据与系统]
    科学家: [地球与气候, 空间与等离子体物理, 天文与宇宙学, 量子与凝聚态, 光学与光子, 生命科学与医学, 化学与材料]
  # 「AI研究者」方向的标签只在论文不属于任何科学学科时才记（科学学科优先）；
  #   例外：科学智能体与基础模型 —— 做科学大模型 / AI 科学家的论文，即使提到具体学科也记这一项
  ai_only_tops: [RSI与自进化, AI for AI, 智能体与推理, 可信与安全, 多模态·生成·世界模型, 具身智能, 图学习·数据与系统]
  always_tag: [科学智能体与基础模型]
  # 只被 AI 方向检索抓到的论文：摘要里普遍有 benchmark/evaluation 等泛词，要求标题命中或摘要命中 2 个不同关键词才算该领域
  strict_min_score: 2
  # AI 方向抓来、但哪个领域都没命中的论文：false = 不进人才库（人才树之外的 AI 应用研究）；true = 保留并记为「未归类」
  keep_unclassified: false
  # 领域 ← 抓取用的检索领域：关键词一个都没命中时，按检索来源归类（列表里第一个为默认）
  fetch_alias:
    RSI与自进化: [大模型训练与自进化, 模型架构与基础模型, 推理与对齐]
    智能体与推理: [智能体与工具链, 代码与软件智能体, AI for Math, 推理与对齐]
    多模态·生成·世界模型: [世界模型与空间智能, 生成模型与多模态]
    科学智能体与基础模型: [科学发现方法与科学计算]
    图学习·数据与系统: [数据合成与评测, AI系统与数据基础设施]
    地球与气候: [气象气候, 地球物理]
    空间与等离子体物理: [等离子体与空间物理]
    生命科学与医学: [蛋白与核酸设计, 药物发现, 细胞与多组学, 分子与反应, 医学AI与临床]
    化学与材料: [材料实验与器件, 能源与催化, 计算材料]
  # 旧分类名 → 新分类名（以前在「人才画像」里人工修正过的领域会自动换成新名字）
  renamed:
    气象气候: 地球与气候
    地球物理: 地球与气候
    等离子体与空间物理: 空间与等离子体物理
    AI for Math: 智能体与推理
    科学发现方法与科学计算: 科学智能体与基础模型
    预训练与模型架构: RSI与自进化
    后训练与对齐: RSI与自进化
    推理与思维链: 智能体与推理
    智能体与工具: 智能体与推理
    代码与软件智能体: 智能体与推理
    多模态大模型: 多模态·生成·世界模型
    生成模型与世界模型: 多模态·生成·世界模型
    数据合成与评测: 图学习·数据与系统
    AI系统与数据基础设施: 图学习·数据与系统
    蛋白与核酸设计: 生命科学与医学
    药物发现: 生命科学与医学
    分子生成模型: 生命科学与医学
    单细胞与虚拟细胞: 生命科学与医学
    肿瘤免疫与多组学: 生命科学与医学
    医学AI与临床: 生命科学与医学
    细胞与多组学: 生命科学与医学
    分子与反应: 生命科学与医学
    材料与器件实验: 化学与材料
    计算材料: 化学与材料
    化学与材料大模型: 化学与材料
    材料实验与器件: 化学与材料
    能源与催化: 化学与材料

  # 维度2：AI方法（在 AI4S 中起什么作用）
  ai_methods:
    ①科学基础模型: ["foundation model", pretrain, pre-train, "protein language model", "chemical language model", "genomic language model", "self-supervised", alphafold, rosettafold, esmfold, esm-2, esm2, "structure prediction"]
    ②生成式设计: ["diffusion model", "denoising diffusion", generative, "flow matching", "variational autoencoder", rfdiffusion, proteinmpnn, "inverse folding", "de novo design", "inverse design", "backbone generation", gan]
    ③科学智能体与推理: ["large language model", llm, llms, "llm agent", "ai agent", "language agent", "autonomous agent", agentic, "multi-agent", reasoning, "chain-of-thought", "ai scientist", "hypothesis generation", "autonomous research", "self-evolv"]
    ④自动化实验与具身: ["self-driving lab", "autonomous lab", "autonomous experiment", robot, "lab automation", "laboratory automation", "closed-loop", "active learning", "bayesian optimization"]
    ⑤数学推理与形式化: ["theorem proving", "formal proof", "formal verification", "lean 4", lean4, mathlib, "symbolic regression", "automated reasoning"]
    ⑥数据、图学习与系统: ["graph neural", gnn, gnns, "knowledge graph", "geometric deep learning", equivariant, "benchmark dataset", database, "data platform", "high-performance comput", "open-source software"]
    ⑦可信与可解释: [uncertainty, interpretab, explainab, calibrat, trustworth, biosecurity, "out-of-distribution", "biosafety"]
  # 一篇论文都没命中上面任何方法时的兜底类别
  ai_method_fallback: ⓪通用预测建模
  # 判定门槛：标题命中记 3 分，摘要命中每个关键词记 1 分，达到门槛才算该类
  min_score:
    science: 1
    method: 2
  # 第二多的类别达到最多类别的这个比例，才记为「副」标签
  secondary_min_share: 0.3
  # 领域按「当前方向」定：论文按发表时间加权，每过 domain_half_life 年权重减半，取权重最高的方向
  domain_half_life: 1.5
  # 副领域只在特别明显时才写：加权后达到主方向的这个比例，且至少这么多篇
  domain_secondary_share: 0.6
  domain_secondary_min_papers: 3

  # 标签1：人才类型 S / A / A×S
  #   优先用作者整个学术生涯的主题分布（作者接口 topics）；没有时用其赛道论文的主题领域
  #   AI侧论文占比 ≥ a_min → A；≤ s_max → S；介于两者之间 → A×S
  talent_type:
    ai_fields: ["Computer Science", "Mathematics", "Decision Sciences"]
    # 赛道论文发表在这些平台也算 AI 侧（名称包含匹配，不区分大小写）
    ai_venues: [arXiv, NeurIPS, "Neural Information Processing", ICML, "International Conference on Machine Learning",
                ICLR, "Learning Representations", AAAI, IJCAI, KDD, "Machine Intelligence", "Machine Learning",
                "Artificial Intelligence", "Pattern Analysis", "Neural Networks", "Computer Vision"]
    # 有作者整个生涯的主题分布时用这组门槛
    a_min: 0.5
    s_max: 0.15
    # 只有赛道论文时（信号更弱）用这组门槛
    track_a_min: 0.5
    track_s_max: 0.1

  # 标签2：层级（自上而下匹配，h 指数缺失时按学术年龄判断）
  tiers:
    - {name: 领军, min_age: 15, min_h: 40}
    - {name: 资深, min_age: 15}
    - {name: 资深, min_h: 30}
    - {name: 青年骨干, min_age: 5}
    - {name: 博士/博后, min_age: 0}

  # 标签3：关系（已建联 / 未建联），在软件「人才画像 → 跟进记录」里人工维护
  relation_levels: ["已建联", "未建联"]
